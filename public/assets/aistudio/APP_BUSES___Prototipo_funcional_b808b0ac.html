<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APP BUSES · Prototipo funcional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8ECEF;--bar:#0F172A;--bar-tx:#F8FAFC;--bar-mute:#94A3B8;--acc:#2DD4BF;--acc-tx:#042F2E;--line:#334155;--alert:#DC2626;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0F17}}
:root[data-theme="dark"]{--bg:#0B0F17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);font-family:Geist,system-ui,sans-serif}
body{display:flex;flex-direction:column}
.bar{background:var(--bar);color:var(--bar-tx);display:flex;align-items:center;gap:16px;padding:8px 14px;flex-wrap:wrap}
.brand{font-family:"Space Grotesk",system-ui,sans-serif;font-weight:700;font-size:16px;white-space:nowrap}
.brand small{color:var(--acc);font-weight:600;margin-left:6px;font-size:11px;letter-spacing:.06em}
.tabs,.devs{display:flex;gap:4px;overflow-x:auto}
.tabs{flex:1;min-width:0}
button{font:500 13px Geist,system-ui,sans-serif;color:var(--bar-mute);background:transparent;border:1px solid transparent;border-radius:9999px;padding:7px 13px;cursor:pointer;white-space:nowrap;position:relative}
button:hover{color:var(--bar-tx)}
button[aria-selected="true"],button[aria-pressed="true"]{background:var(--acc);color:var(--acc-tx)}
.devs{border:1px solid var(--line);border-radius:9999px;padding:2px}
.dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--alert);display:none}
button.alert .dot{display:block}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px}
iframe{border:0;width:100%;height:100%;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(15,23,42,.25)}
iframe[hidden]{display:none}
.stage[data-dev="movil"] iframe{max-width:390px;max-height:844px}
.stage[data-dev="tablet"] iframe{max-width:1024px;max-height:768px}
.stage[data-dev="desktop"] iframe{border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--bar);color:var(--bar-tx);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:all 240ms cubic-bezier(.16,1,.3,1);max-width:90vw;border:1px solid var(--line)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:600px){.stage{padding:0}iframe{border-radius:0;max-width:none!important;max-height:none!important}.devs{display:none}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">APP BUSES<small>PROTOTIPO · BAQ</small></div>
  <nav class="tabs" role="tablist" aria-label="Pantallas">
    <button role="tab" data-s="mapa">Pasajero · Mapa</button>
    <button role="tab" data-s="billetera">Pasajero · Billetera</button>
    <button role="tab" data-s="conductor">Conductor</button>
    <button role="tab" data-s="operador">Operador<span class="dot"></span></button>
  </nav>
  <div class="devs" aria-label="Dispositivo">
    <button data-d="movil">Móvil</button>
    <button data-d="tablet">Tablet</button>
    <button data-d="desktop">Escritorio</button>
  </div>
</header>
<main class="stage" id="stage">
  <iframe data-s="mapa" title="Pasajero · Mapa y rutas" hidden></iframe>
  <iframe data-s="billetera" title="Pasajero · Billetera y ticket QR" hidden></iframe>
  <iframe data-s="conductor" title="Conductor · Consola de conducción" hidden></iframe>
  <iframe data-s="operador" title="Operador · Centro de control de flota" hidden></iframe>
</main>
<div class="toast" id="toast" role="status"></div>

te-800 text-slate-300 font-label text-label-md\">\n          Cancelar\n        <\/button>\n        <button type=\"button\" onclick=\"sendBroadcast()\" class=\"py-2.5 px-4 rounded-md bg-teal-accent hover:bg-teal-600 text-white font-label text-label-md font-semibold\">\n          Transmitir Mensaje\n        <\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <script>\n    function inspectBus(id, route, driver, pax, rev, status) {\n      document.getElementById('modalBusId').innerText = 'Unidad #' + id;\n      document.getElementById('modalBusRoute').innerText = route;\n      document.getElementById('modalDriver').innerText = driver;\n      document.getElementById('modalPax').innerText = pax;\n      document.getElementById('modalRevenue').innerText = rev;\n      document.getElementById('modalStatus').innerText = status;\n\n      const modal = document.getElementById('busInspectModal');\n      modal.classList.remove('hidden');\n      modal.classList.add('flex');\n    }\n\n    function closeInspectModal() {\n      const modal = document.getElementById('busInspectModal');\n      modal.classList.add('hidden');\n      modal.classList.remove('flex');\n    }\n\n    function openBroadcastModal() {\n      const modal = document.getElementById('broadcastModal');\n      modal.classList.remove('hidden');\n      modal.classList.add('flex');\n    }\n\n    function closeBroadcastModal() {\n      const modal = document.getElementById('broadcastModal');\n      modal.classList.add('hidden');\n      modal.classList.remove('flex');\n    }\n\n    function sendBroadcast() {\n      closeBroadcastModal();\n      alert('Comunicado transmitido a las consolas de los conductores seleccionados.');\n    }\n  <\/script>\n\n\n<script data-bridge>\n(function(){\nvar S=\"operador\";\nfunction P(m){m.busApp=1;m.screen=S;parent.postMessage(m,\"*\")}\nvar R={\"PassengerHome.html\":\"mapa\",\"PassengerWalletTicket.html\":\"billetera\",\"DriverCockpit.html\":\"conductor\",\"OperatorDashboard.html\":\"operador\"};\ndocument.addEventListener(\"click\",function(e){var a=e.target.closest&&e.target.closest(\"a[href]\");if(!a)return;var h=a.getAttribute(\"href\");for(var k in R){if(h.indexOf(k)>-1){e.preventDefault();P({type:\"nav\",to:R[k]});return}}},true);\nfunction wrap(n,f){var o=window[n];if(typeof o===\"function\")window[n]=function(){var r=o.apply(this,arguments);f();return r}}\nif(S===\"billetera\"){var d=document.getElementById(\"walletBalanceDisplay\");if(d)new MutationObserver(function(){P({type:\"balance\",value:parseInt(d.textContent.replace(/\\D/g,\"\"),10)||0})}).observe(d,{childList:true,characterData:true,subtree:true})}\nif(S===\"conductor\"){wrap(\"simulateBoarding\",function(){P({type:\"boarding\"})});wrap(\"confirmPanicAlert\",function(){P({type:\"panic\"})})}\nif(S===\"operador\"){wrap(\"sendBroadcast\",function(){var t=document.querySelector(\"#broadcastModal textarea\");P({type:\"broadcast\",text:t?t.value.trim():\"\"})})}\nvar kpi,bdg,k0=0,b0=0;\naddEventListener(\"message\",function(e){var d=e.data;if(!d||!d.busApp)return;\nif(d.type===\"state\"){\n if(S===\"mapa\")document.querySelectorAll('a[href*=\"PassengerWalletTicket\"] span').forEach(function(s){if(/^\\$[\\d.]+$/.test(s.textContent.trim()))s.textContent=\"$\"+d.balance.toLocaleString(\"es-CO\")});\n if(S===\"operador\"){\n  if(!kpi){kpi=[].slice.call(document.querySelectorAll(\"span\")).filter(function(s){return s.textContent.trim()===\"84.290\"})[0];k0=84290;\n   var a=[].slice.call(document.querySelectorAll(\"a\")).filter(function(x){return x.textContent.indexOf(\"Incidencias\")>-1})[0];\n   if(a){var sp=a.querySelectorAll(\"span\");bdg=sp[sp.length-1];b0=parseInt(bdg.textContent,10)||0}}\n  if(kpi)kpi.textContent=(k0+d.pax).toLocaleString(\"es-CO\");\n  if(bdg)bdg.textContent=b0+d.inc}}\nelse if(d.type===\"broadcast\"&&S===\"conductor\"&&window.showDriverToast)showDriverToast(\"Despacho: \"+(d.text||\"nuevo comunicado recibido\"),\"campaign\")});\nP({type:\"ready\"});\n})();\n<\/script>\n<\/body><\/html>"};
const NATIVE = {mapa:'movil', billetera:'movil', conductor:'tablet', operador:'desktop'};
const st = {balance:18600, pax:0, inc:0, q:[]};
const $ = (s, r=document) => r.querySelector(s);
const frames = {};
document.querySelectorAll('iframe').forEach(f => frames[f.dataset.s] = f);
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3200)}
function setDevice(d){$('#stage').dataset.dev=d;document.querySelectorAll('[data-d]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.d===d))}
function show(s){
  if(!SCREENS[s]) s='mapa';
  for(const k in frames){const on=k===s;frames[k].hidden=!on;if(on&&!frames[k].srcdoc)frames[k].srcdoc=SCREENS[k]}
  document.querySelectorAll('[data-s][role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===s));
  if(s==='operador')$('[data-s=operador]').classList.remove('alert');
  setDevice(NATIVE[s]);
  if(location.hash!=='#'+s)location.hash=s;
}
function state(){return {busApp:1,type:'state',balance:st.balance,pax:st.pax,inc:st.inc}}
function post(s,m){const w=frames[s].contentWindow;if(w&&frames[s].srcdoc)w.postMessage(m,'*')}
document.querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>show(b.dataset.s));
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>setDevice(b.dataset.d));
addEventListener('hashchange',()=>show(location.hash.slice(1)));
addEventListener('message',e=>{
  const d=e.data;if(!d||!d.busApp)return;
  const from=Object.keys(frames).find(k=>frames[k].contentWindow===e.source);
  if(d.type==='nav')show(d.to);
  else if(d.type==='ready'){
    post(from,state());
    if(from==='conductor'){st.q.forEach(m=>post('conductor',m));st.q=[]}
  }
  else if(d.type==='balance'){st.balance=d.value;post('mapa',state())}
  else if(d.type==='boarding'){st.pax++;post('operador',state());toast('Pasaje validado: el Centro de Control sumó +1 pasajero')}
  else if(d.type==='panic'){st.inc++;post('operador',state());$('[data-s=operador]').classList.add('alert');toast('Alerta de pánico del bus #B-304 recibida en el Operador')}
  else if(d.type==='broadcast'){
    const m={busApp:1,type:'broadcast',text:d.text};
    if(frames.conductor.srcdoc)post('conductor',m);else st.q.push(m);
    toast('Comunicado enviado a las consolas de conductores');
  }
});
show(location.hash.slice(1)||'mapa');
</script>
